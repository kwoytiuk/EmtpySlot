<?xml version="1.0" encoding="UTF-8"?>
<svg width="456" height="456" viewBox="0 0 456 456" xmlns="http://www.w3.org/2000/svg">
  <!-- Professional EmptySlot splash screen with modern branding -->
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DA3743;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C62828;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B71C1C;stop-opacity:1" />
    </linearGradient>

    <!-- Logo icon gradient -->
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F8F9FA;stop-opacity:1" />
    </linearGradient>

    <!-- Shadow -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="8" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="456" height="456" fill="url(#bgGradient)"/>

  <!-- Decorative pattern -->
  <circle cx="50" cy="50" r="100" fill="#FFFFFF" opacity="0.03"/>
  <circle cx="406" cy="406" r="120" fill="#FFFFFF" opacity="0.03"/>
  <circle cx="380" cy="80" r="60" fill="#000000" opacity="0.05"/>

  <!-- Logo Container -->
  <g transform="translate(228, 160)">

    <!-- Logo background circle with shadow -->
    <circle cx="0" cy="0" r="75" fill="#FFFFFF" opacity="0.15" filter="url(#shadow)"/>

    <!-- Main logo icon - Calendar with clock -->
    <g transform="scale(0.85)">

      <!-- Calendar base -->
      <rect x="-50" y="-40" width="100" height="90" rx="10" fill="url(#logoGradient)" filter="url(#shadow)"/>

      <!-- Calendar header -->
      <rect x="-50" y="-40" width="100" height="22" rx="10" fill="#DA3743"/>
      <rect x="-50" y="-25" width="100" height="15" fill="#DA3743"/>

      <!-- Calendar rings -->
      <circle cx="-30" cy="-35" r="5" fill="none" stroke="#FFFFFF" stroke-width="3"/>
      <circle cx="0" cy="-35" r="5" fill="none" stroke="#FFFFFF" stroke-width="3"/>
      <circle cx="30" cy="-35" r="5" fill="none" stroke="#FFFFFF" stroke-width="3"/>

      <!-- Calendar grid dots -->
      <circle cx="-30" cy="-5" r="3" fill="#DA3743" opacity="0.3"/>
      <circle cx="-10" cy="-5" r="3" fill="#DA3743" opacity="0.3"/>
      <circle cx="10" cy="-5" r="3" fill="#DA3743" opacity="0.3"/>
      <circle cx="30" cy="-5" r="3" fill="#DA3743" opacity="0.3"/>

      <circle cx="-30" cy="15" r="3" fill="#DA3743" opacity="0.3"/>
      <circle cx="-10" cy="15" r="3" fill="#DA3743" opacity="0.3"/>
      <circle cx="10" cy="15" r="3" fill="#DA3743" opacity="0.5"/>
      <circle cx="30" cy="15" r="3" fill="#DA3743" opacity="0.3"/>

      <!-- Featured time slot (highlighted) -->
      <circle cx="10" cy="15" r="8" fill="#DA3743" opacity="0.9"/>
      <circle cx="10" cy="15" r="6" fill="#FFFFFF"/>

      <!-- Clock hands on featured slot -->
      <line x1="10" y1="15" x2="10" y2="10" stroke="#DA3743" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="10" y1="15" x2="13" y2="17" stroke="#DA3743" stroke-width="1.5" stroke-linecap="round"/>

      <circle cx="-30" cy="35" r="3" fill="#DA3743" opacity="0.3"/>
      <circle cx="-10" cy="35" r="3" fill="#DA3743" opacity="0.3"/>
      <circle cx="10" cy="35" r="3" fill="#DA3743" opacity="0.3"/>
      <circle cx="30" cy="35" r="3" fill="#DA3743" opacity="0.3"/>
    </g>
  </g>

  <!-- Brand name with modern typography -->
  <text x="228" y="310" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="700" letter-spacing="-2" filter="url(#glow)">
    Empty<tspan fill="#FFE6E8">Slot</tspan>
  </text>

  <!-- Tagline -->
  <text x="228" y="350" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" letter-spacing="2" opacity="0.9">
    BOOK YOUR PERFECT TIME
  </text>

  <!-- Subtle divider -->
  <line x1="178" y1="368" x2="278" y2="368" stroke="#FFFFFF" stroke-width="2" opacity="0.3" stroke-linecap="round"/>

</svg>
