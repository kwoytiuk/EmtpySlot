<?xml version="1.0" encoding="UTF-8"?>
<svg width="456" height="456" viewBox="0 0 456 456" xmlns="http://www.w3.org/2000/svg">
  <!-- Professional splash screen with OpenTable-inspired branding -->
  <defs>
    <linearGradient id="splashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DA3743;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B71C1C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFEBEE;stop-opacity:0.95" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="456" height="456" fill="url(#splashBg)"/>

  <!-- Clock icon representing time slot bookings -->
  <g transform="translate(128, 100)">
    <!-- Clock circle -->
    <circle cx="100" cy="100" r="90" fill="url(#iconGlow)" opacity="0.98" stroke="#FFFFFF" stroke-width="8"/>

    <!-- Clock face details -->
    <circle cx="100" cy="60" r="6" fill="#DA3743" opacity="0.8"/>
    <circle cx="140" cy="100" r="6" fill="#DA3743" opacity="0.8"/>
    <circle cx="100" cy="140" r="6" fill="#DA3743" opacity="0.8"/>
    <circle cx="60" cy="100" r="6" fill="#DA3743" opacity="0.8"/>

    <!-- Center dot -->
    <circle cx="100" cy="100" r="8" fill="#DA3743"/>

    <!-- Hour hand (pointing at 5) -->
    <line x1="100" y1="100" x2="75" y2="130" stroke="#DA3743" stroke-width="8" stroke-linecap="round"/>

    <!-- Minute hand (pointing at 12) -->
    <line x1="100" y1="100" x2="100" y2="50" stroke="#B71C1C" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- App name -->
  <text x="228" y="330" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" letter-spacing="-1">EmptySlot</text>

  <!-- Tagline -->
  <text x="228" y="370" text-anchor="middle" fill="#FFEBEE" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" letter-spacing="1">Book Your Perfect Time</text>
</svg>
