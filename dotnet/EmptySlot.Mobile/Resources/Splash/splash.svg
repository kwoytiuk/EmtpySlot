<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="456"
  height="456"
  viewBox="0 0 456 456"
  xmlns="http://www.w3.org/2000/svg"
  aria-label="EmptySlot Splash Screen">

  <!-- Background -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="456" height="456" fill="url(#bg)"/>

  <!-- Accent glow -->
  <circle cx="350" cy="100" r="120" fill="url(#glow)"/>
  <circle cx="100" cy="350" r="140" fill="url(#glow)" opacity="0.5"/>

  <!-- Center Icon/Logo -->
  <g transform="translate(78,78)">
    <!-- Calendar-style container -->
    <rect width="300" height="300" rx="80" fill="#0B1220" stroke="#2B3448" stroke-width="3"/>

    <!-- Calendar slots -->
    <rect x="85" y="105" width="130" height="24" rx="12" fill="#2B3448"/>
    <rect x="85" y="150" width="130" height="24" rx="12" fill="#2B3448"/>
    <rect x="85" y="195" width="130" height="24" rx="12" fill="#22C55E"/>

    <!-- "E" Logo below -->
    <g transform="translate(85,240)">
      <rect x="0" y="0" width="40" height="8" rx="4" fill="#E5E7EB"/>
      <rect x="0" y="16" width="40" height="8" rx="4" fill="#E5E7EB"/>
      <rect x="0" y="32" width="40" height="8" rx="4" fill="#22C55E"/>
    </g>
  </g>

</svg>
