<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>EmptySlot</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="_content/EmptySlot.Shared.UI/css/app.css" />
</head>

<body>
    <div id="app">
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;">
            <h1 style="font-size: 48px; margin: 0;">⚡</h1>
            <p style="color: #6B7280; margin: 16px 0;">Loading...</p>
        </div>
    </div>

    <div id="blazor-error-ui" style="background: lightyellow; bottom: 0; box-shadow: 0 -1px 5px rgba(0,0,0,0.2); display: none; left: 0; padding: 0.6rem 1.25rem 0.7rem 1.25rem; position: fixed; width: 100%; z-index: 1000;">
        An unhandled error has occurred.
        <a href="" style="margin-left: 1.5rem;">Reload</a>
        <a class="dismiss" style="margin-left: 1.5rem;">🗙</a>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>

</html>
